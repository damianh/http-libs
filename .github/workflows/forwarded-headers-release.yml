name: forwarded-headers/release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (x.y.z or x.y.z-prerelease.1)'
        required: true
        type: string

jobs:
  release:
    permissions:
      contents: write
    uses: ./.github/workflows/release-template.yml
    with:
      product: forwarded-headers
      package: DamianH.Http.ForwardedHeaders
      tag-prefix: fwd-v
      version: ${{ inputs.version }}
    secrets:
      NUGET_ORG_APIKEY: ${{ secrets.NUGET_ORG_APIKEY }}
