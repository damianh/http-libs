name: hybrid-cache-handler/checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - '**'
    paths:
      - .github/workflows/hybrid-cache-handler-checks.yml
      - hybrid-cache-handler/**
      - Directory.Build.props
      - global.json
      - http-lib.slnx
  pull_request:
    paths:
      - .github/workflows/hybrid-cache-handler-checks.yml
      - hybrid-cache-handler/**
      - Directory.Build.props
      - global.json
      - http-lib.slnx

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run benchmarks
        run: |
          cd hybrid-cache-handler/benchmarks/Benchmarks
          dotnet run --project Benchmarks.csproj --configuration Release -- --exporters json
        continue-on-error: true

      - name: Run streaming staging benchmarks
        run: |
          cd hybrid-cache-handler/benchmarks/Benchmarks
          dotnet run --project Benchmarks.csproj --configuration Release -- --filter "*StreamingFillBenchmarks*" --job short --exporters json

      - name: Add benchmark results to summary
        if: always()
        run: |
          echo "## Benchmark Results" >> $GITHUB_STEP_SUMMARY
          if [ -f "hybrid-cache-handler/benchmarks/Benchmarks/BenchmarkDotNet.Artifacts/results/Benchmarks-report.json" ]; then
            echo "Benchmark completed successfully. Full results available in artifacts." >> $GITHUB_STEP_SUMMARY
          else
            echo "Benchmark execution completed with warnings or errors." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: hybrid-cache-handler/benchmarks/Benchmarks/BenchmarkDotNet.Artifacts/
          if-no-files-found: ignore

  cache-conformance:
    name: "RFC 9111: ${{ matrix.framework }} / ${{ matrix.mode }} (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        framework: [net10.0, netstandard2.0, net472]
        mode: [default, filesystem]
        exclude:
          - os: ubuntu-latest
            framework: net472
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify result gates and IPC protocol
        shell: pwsh
        run: |
          node --test hybrid-cache-handler/conformance/compare-results.test.mjs hybrid-cache-handler/conformance/worker-lifecycle.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project hybrid-cache-handler/conformance/ConformanceProtocol.Tests/ConformanceProtocol.Tests.csproj --configuration Release
          exit $LASTEXITCODE

      - name: Run RFC 9111 conformance suite (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash hybrid-cache-handler/conformance/run-conformance.sh --framework ${{ matrix.framework }} ${{ matrix.mode == 'filesystem' && '--file-system' || '' }}

      - name: Run RFC 9111 conformance suite (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\hybrid-cache-handler\conformance\run-conformance.ps1 -Framework ${{ matrix.framework }} ${{ matrix.mode == 'filesystem' && '-FileSystem' || '' }}

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-conformance-results-${{ matrix.framework }}-${{ matrix.mode }}-${{ matrix.os }}
          path: |
            hybrid-cache-handler/conformance/results-${{ matrix.framework }}-${{ matrix.mode }}.json
            hybrid-cache-handler/conformance/${{ matrix.framework }}-${{ matrix.mode }}-*.log
            hybrid-cache-handler/conformance/${{ matrix.framework }}-${{ matrix.mode }}-provenance.json
            hybrid-cache-handler/conformance/worker-lifecycle.log
          if-no-files-found: ignore
