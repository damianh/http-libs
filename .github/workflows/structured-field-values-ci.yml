name: structured-field-values/ci

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - '**'
    paths:
      - .github/BuildHelpers/**
      - .github/workflows/structured-field-values-ci.yml
      - .github/workflows/ci-template.yml
      - structured-field-values/**
      - .editorconfig
      - Directory.Build.props
      - Directory.Build.targets
      - global.json
      - http-lib.slnx
  pull_request:
    paths:
      - .github/BuildHelpers/**
      - .github/workflows/structured-field-values-ci.yml
      - .github/workflows/ci-template.yml
      - structured-field-values/**
      - .editorconfig
      - Directory.Build.props
      - Directory.Build.targets
      - global.json
      - http-lib.slnx

jobs:
  build:
    uses: ./.github/workflows/ci-template.yml
    with:
      product: structured-field-values
      test-targets: '["test"]'
