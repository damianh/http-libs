name: deploy-docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .config/dotnet-tools.json
      - .github/BuildHelpers/**
      - .github/workflows/deploy-docs.yml
      - .editorconfig
      - Directory.Build.props
      - global.json
      - http-lib.slnx
      - README.md
      - hybrid-cache-handler/**/*.md
      - file-distributed-cache/**/*.md
      - structured-field-values/**/*.md
      - signatures/**/*.md
      - forwarded-headers/**/*.md
  pull_request:
    paths:
      - docs/**
      - .config/dotnet-tools.json
      - .github/BuildHelpers/**
      - .github/workflows/deploy-docs.yml
      - .editorconfig
      - Directory.Build.props
      - global.json
      - http-lib.slnx
      - README.md
      - hybrid-cache-handler/**/*.md
      - file-distributed-cache/**/*.md
      - structured-field-values/**/*.md
      - signatures/**/*.md
      - forwarded-headers/**/*.md
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build and check documentation
        run: dotnet run docs/build.cs -- build
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/Docs/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
